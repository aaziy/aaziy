<svg viewBox="0 0 1200 84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="End of transmission — thanks for stopping by">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#121822"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#16202B" stroke-width="1"/>
    </pattern>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2EE6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2EE6FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2EE6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="84" rx="14" fill="url(#bgGlow)"/>
  <rect width="1200" height="84" rx="14" fill="url(#grid)" opacity="0.5"/>
  <rect x="0.75" y="0.75" width="1198.5" height="82.5" rx="13.25" fill="none" stroke="#1B2330" stroke-width="1.5"/>

  <g stroke="#2EE6FF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M18,36 L18,18 L36,18"/>
    <path d="M1164,18 L1182,18 L1182,36"/>
    <path d="M1182,48 L1182,66 L1164,66"/>
    <path d="M36,66 L18,66 L18,48"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace">
    <!-- left: session state -->
    <circle cx="58" cy="42" r="4" fill="#FFC857">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="46.5" font-size="13" font-weight="600" fill="#C9B98A" letter-spacing="1.2">END OF TRANSMISSION</text>

    <!-- center: thank-you between two live traces -->
    <line x1="270" y1="42" x2="452" y2="42" stroke="#1EA8C4" stroke-width="1.2" stroke-dasharray="2 7" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <text x="600" y="47" text-anchor="middle" font-size="14" font-weight="600" fill="#2EE6FF" letter-spacing="3">THANKS FOR STOPPING BY</text>
    <line x1="748" y1="42" x2="930" y2="42" stroke="#1EA8C4" stroke-width="1.2" stroke-dasharray="2 7" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="36" dur="1.8s" repeatCount="indefinite"/>
    </line>

    <!-- right: prompt with blinking cursor -->
    <text x="1130" y="46.5" text-anchor="end" font-size="13" fill="#9FB1BD"><tspan fill="#2EE6FF">aaziy@github</tspan>:~$</text>
    <rect x="1136" y="33" width="9" height="17" fill="#2EE6FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- slow sweep across the strip -->
  <rect x="300" y="82" width="600" height="2" fill="url(#trace)" opacity="0.6">
    <animate attributeName="x" values="-600;1200" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
